<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">

<title>P2PSPARK</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f5f7fa;
  color:#111827;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,#e9eef7 0,#f5f7fa 40%,#eef1f5 100%);
}

.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(15,23,42,.10);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
}

.logo-mark{
  width:46px;
  height:46px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111827;
  color:#fff;
  font-weight:800;
  font-size:17px;
}

.logo-text{
  font-size:22px;
  font-weight:800;
  letter-spacing:.3px;
}

.login-title{
  margin:0 0 8px;
  font-size:28px;
  font-weight:800;
}

.login-subtitle{
  color:#6b7280;
  margin:0 0 24px;
  line-height:1.5;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
  color:#374151;
}

.input{
  width:100%;
  height:48px;
  padding:0 15px;
  border:1px solid #dfe3e8;
  border-radius:12px;
  background:#fff;
  outline:none;
  transition:.2s;
}

.input:focus{
  border-color:#111827;
  box-shadow:0 0 0 3px rgba(17,24,39,.07);
}

.primary-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:#fff;
  font-weight:700;
  transition:.2s;
}

.primary-btn:hover{
  opacity:.92;
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.login-error{
  display:none;
  margin-top:15px;
  padding:12px 14px;
  border-radius:10px;
  background:#fef2f2;
  color:#b91c1c;
  font-size:13px;
  line-height:1.45;
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  min-height:100vh;
  background:#fff;
  border-right:1px solid #e5e7eb;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  display:flex;
  flex-direction:column;
  z-index:50;
}

.sidebar-header{
  height:76px;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid #eef0f2;
}

.sidebar-brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:800;
}

.sidebar-brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#111827;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:13px;
}

.sidebar-menu{
  flex:1;
  overflow-y:auto;
  padding:14px 12px;
}

.menu-section{
  margin:18px 8px 8px;
  color:#9ca3af;
  text-transform:uppercase;
  font-size:10px;
  font-weight:800;
  letter-spacing:.8px;
}

.menu-item{
  width:100%;
  border:0;
  background:transparent;
  color:#4b5563;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:10px;
  text-align:left;
  margin-bottom:3px;
  font-size:14px;
  font-weight:600;
}

.menu-item:hover{
  background:#f3f4f6;
  color:#111827;
}

.menu-item.active{
  background:#111827;
  color:#fff;
}

.menu-icon{
  width:20px;
  text-align:center;
  font-size:16px;
}

.sidebar-footer{
  padding:12px;
  border-top:1px solid #eef0f2;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:8px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#374151;
}

.user-mini-info{
  min-width:0;
}

.user-mini-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.user-mini-role{
  color:#9ca3af;
  font-size:11px;
}

/* MAIN */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:76px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
}

.topbar-title{
  font-size:21px;
  font-weight:800;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu-btn{
  display:none;
  border:0;
  background:#f3f4f6;
  width:42px;
  height:42px;
  border-radius:10px;
}

.page{
  padding:28px;
}

.page-header{
  margin-bottom:22px;
}

.page-title{
  margin:0 0 5px;
  font-size:25px;
  font-weight:800;
}

.page-description{
  margin:0;
  color:#6b7280;
  font-size:14px;
}

/* CARDS */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
}

.stat-label{
  color:#6b7280;
  font-size:13px;
  margin-bottom:10px;
}

.stat-value{
  font-size:25px;
  font-weight:800;
}

.stat-small{
  margin-top:7px;
  color:#9ca3af;
  font-size:12px;
}

/* CONTENT GRID */

.content-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:15px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  height:43px;
  padding:0 17px;
  border:0;
  border-radius:10px;
  font-weight:700;
}

.btn-dark{
  background:#111827;
  color:#fff;
}

.btn-light{
  background:#f3f4f6;
  color:#111827;
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-success{
  background:#dcfce7;
  color:#166534;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:13px 12px;
  border-bottom:1px solid #eef0f2;
  text-align:left;
  white-space:nowrap;
  font-size:13px;
}

th{
  color:#6b7280;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.empty{
  text-align:center;
  color:#9ca3af;
  padding:30px;
}

/* BADGES */

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-red{
  background:#fee2e2;
  color:#991b1b;
}

.badge-gray{
  background:#f3f4f6;
  color:#4b5563;
}

.badge-dark{
  background:#111827;
  color:#fff;
}

/* PROFILE */

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.profile-field{
  padding:15px;
  border:1px solid #eef0f2;
  border-radius:12px;
}

.profile-label{
  color:#9ca3af;
  font-size:11px;
  margin-bottom:5px;
}

.profile-value{
  font-weight:700;
  word-break:break-word;
}

/* REQUISITES */

.requisite-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.qr-box{
  width:190px;
  height:190px;
  border:1px dashed #d1d5db;
  border-radius:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#f9fafb;
}

.qr-box img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:11px 0;
  border-bottom:1px solid #eef0f2;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:#6b7280;
  font-size:13px;
}

.info-value{
  font-size:13px;
  font-weight:700;
  text-align:right;
  word-break:break-all;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-box{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 25px 80px rgba(0,0,0,.2);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:20px;
  font-weight:800;
}

.close-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:9px;
  background:#f3f4f6;
  font-size:18px;
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:200;
  max-width:350px;
  padding:13px 16px;
  border-radius:12px;
  background:#111827;
  color:#fff;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(20px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.error{
  background:#991b1b;
}

/* LOADING */

.loading{
  min-height:200px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#6b7280;
}

/* RESPONSIVE */

@media(max-width:1100px){
  .stats-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .content-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu-btn{
    display:block;
  }

  .topbar{
    padding:0 15px;
  }

  .page{
    padding:18px 14px;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:15px;
  }

  .stat-value{
    font-size:20px;
  }

  .profile-grid,
  .requisite-grid,
  .modal-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){

  .login-box{
    padding:24px 18px;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .topbar-title{
    font-size:17px;
  }

  .page-title{
    font-size:22px;
  }

  .actions .btn{
    width:100%;
  }

  .qr-box{
    width:160px;
    height:160px;
  }
}
</style>
</head>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://kzdaiqhnjcdsinzaygao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sBlX-C1Wyp36sVki_6q1_A_13_Nl-ag";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentProfile = null;
let currentRequisites = null;


/* =====================================================
   HELPERS
===================================================== */

function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatMoney(value){

  const number =
    Number(value || 0);

  return number.toLocaleString(
    "ru-RU",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}


function showToast(message,error=false){

  const toast = $("toast");

  toast.textContent = message;

  toast.classList.toggle(
    "error",
    error
  );

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },3500);
}


function showLoginError(message){

  const box = $("loginError");

  box.textContent = message;

  box.style.display = "block";
}


function clearLoginError(){

  const box = $("loginError");

  box.textContent = "";

  box.style.display = "none";
}


function getInitials(name,email){

  const source =
    name ||
    email ||
    "U";

  const parts =
    source.trim().split(/\s+/);

  if(parts.length >= 2){

    return (
      parts[0][0] +
      parts[1][0]
    ).toUpperCase();

  }

  return source
    .slice(0,2)
    .toUpperCase();
}


function roleName(role){

  if(!role){
    return "USER";
  }

  return String(role).toUpperCase();
}


/* =====================================================
   AUTH
===================================================== */

async function login(email,password){

  clearLoginError();

  const button =
    $("loginButton");

  button.disabled = true;
  button.textContent = "Вход...";

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email:email.trim(),
        password:password
      });

    if(error){
      throw error;
    }

    if(!data.user){
      throw new Error(
        "Пользователь не найден."
      );
    }

    currentUser =
      data.user;

    await loadProfile();

    await showApplication();

  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    let message =
      error?.message ||
      "Не удалось выполнить вход.";

    if(
      message.toLowerCase()
        .includes("invalid login credentials")
    ){
      message =
        "Неверный email или пароль. Проверьте, что этот пользователь создан именно в текущем Supabase.";
    }

    if(
      message.toLowerCase()
        .includes("email not confirmed")
    ){
      message =
        "Email пользователя не подтверждён в Supabase.";
    }

    showLoginError(message);

  }finally{

    button.disabled = false;
    button.textContent = "Войти";

  }

}


async function loadProfile(){

  if(!currentUser){
    throw new Error(
      "Не найден пользователь Supabase."
    );
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

    throw new Error(
      "Авторизация прошла, но профиль не загрузился: " +
      error.message
    );

  }

  if(!data){

    throw new Error(
      "Профиль пользователя не найден в таблице profiles. " +
      "Нужно создать профиль для этого Auth пользователя."
    );

  }

  currentProfile = data;

}


async function checkSession(){

  try{

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    const session =
      data?.session;

    if(!session){

      showLogin();

      return;

    }

    currentUser =
      session.user;

    try{

      await loadProfile();

      await showApplication();

    }catch(error){

      console.error(error);

      await supabaseClient.auth.signOut();

      showLogin();

      showLoginError(
        error.message ||
        "Не удалось загрузить профиль."
      );

    }

  }catch(error){

    console.error(
      "SESSION ERROR",
      error
    );

    showLogin();

  }

}


supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(event === "SIGNED_OUT"){

      currentUser = null;
      currentProfile = null;
      currentRequisites = null;

      showLogin();

    }

  }
);

async function renderPage(page){

    pageTitles[page] ||
    "P2PSPARK";

  const container =
    $("pageContainer");

  container.innerHTML =
    `<div class="loading">Загрузка...</div>`;

  try{

    switch(page){

      case "dashboard":
        await renderDashboard();
        break;

      case "finances":
        await renderFinances();
        break;

      case "deals":
        await renderDeals();
        break;

      case "requests":
        await renderRequests();
        break;

      case "disputes":
        await renderDisputes();
        break;

        await renderRequisites();

        break;

      case "turbo":
        await renderTurbo();
        break;

      case "counterparties":
        await renderCounterparties();
        break;

      case "reports":
        await renderReports();
        break;

      case "profile":
        await renderProfile();
        break;

      case "admin":
        await renderAdmin();
        break;

    <div class="modal-grid">

      <div class="form-group">

        <label>Имя</label>

          class="input"
          value="${escapeHtml(
            user.name || ""
          )}"
        >

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          class="input"
          value="${escapeHtml(
            user.email || ""
          )}"
          disabled
        >

      </div>

      <div class="form-group">

        <label>Роль</label>

        <select id="editRole" class="input">

          <option value="USER"
            ${String(user.role).toUpperCase()==="USER"?"selected":""}>
            USER
          </option>

          <option value="ADMIN"
            ${String(user.role).toUpperCase()==="ADMIN"?"selected":""}>
            ADMIN
          </option>

        </select>

      </div>

      <div class="form-group">

        <label>Статус</label>

        <select id="editStatus" class="input">

          <option value="active"
            ${String(user.status).toLowerCase()==="active"?"selected":""}>
            active
          </option>

          <option value="blocked"
            ${String(user.status).toLowerCase()==="blocked"?"selected":""}>
            blocked
          </option>

        </select>

      </div>

      <div class="form-group">

        <label>Депозит</label>

        <input
          id="editDeposit"
          class="input"
          type="number"
          step="0.01"
          value="${Number(user.deposit || 0)}"
        >

      </div>

      <div class="form-group">

        <label>Оборот</label>

        <input
          id="editTurnover"
          class="input"
          type="number"
          step="0.01"
          value="${Number(user.turnover || 0)}"
        >

      </div>

      <div class="form-group">

        <label>Прибыль</label>

        <input
          id="editProfit"
          class="input"
          type="number"
          step="0.01"
          value="${Number(user.profit || 0)}"
        >

      </div>

      <div class="form-group">

        <label>Комиссия</label>

        <input
          id="editCommission"
          class="input"
          type="number"
          step="0.01"
          value="${Number(user.commission || 0)}"
        >

      </div>

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Отмена
      </button>

      <button
        class="btn btn-dark"
        onclick="saveUser('${user.id}')"
      >
        Сохранить
      </button>

    </div>

  `;

  openModal();

}


async function saveUser(userId){

  const payload = {

    name:
      $("editName").value.trim(),

    role:
      $("editRole").value,

    status:
      $("editStatus").value,

    deposit:
      Number($("editDeposit").value || 0),

    turnover:
      Number($("editTurnover").value || 0),

    profit:
      Number($("editProfit").value || 0),

    commission:
      Number($("editCommission").value || 0)

  };

  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update(payload)
      .eq("id",userId);

  if(error){

    showToast(
      error.message,
      true
    );

    return;

  }

  closeModal();

  showToast(
    "Пользователь обновлён"
  );

  await loadProfile();

  await renderAdmin();

}

async function submitWithdraw(){

  const amount =
    Number(
      $("withdrawAmount").value
    );

  const wallet =
    $("withdrawWallet").value.trim();

  if(!amount || amount <= 0){

    showToast(
      "Введите корректную сумму.",
      true
    );

    return;

  }

  if(!wallet){

    showToast(
      "Введите реквизиты.",
      true
    );

    return;

  }

  /*
    Здесь можно подключить таблицу withdrawals,
    когда она есть в вашем Supabase.
  */

  closeModal();

  showToast(
    "Заявка подготовлена. После подключения таблицы withdrawals она будет записываться в базу."
  );

}


/* =====================================================
   MODAL
===================================================== */

function openModal(){

  $("modal")
    .classList.remove("hidden");

}


function closeModal(){

  $("modal")
    .classList.add("hidden");

}


$("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


$("modal")
  .addEventListener(
    "click",
    event=>{

      if(event.target === $("modal")){
        closeModal();
      }

    }
  );

===================================================== */

$("loginForm")
  .addEventListener(
    "submit",
    async event=>{

      event.preventDefault();

      const email =
        $("loginEmail")
          .value
          .trim();

      const password =
        $("loginPassword")
