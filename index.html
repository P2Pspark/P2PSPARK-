.toast{

.toast.show{

<script>

/* =================================================
   SUPABASE CONFIG
================================================= */

const SUPABASE_URL =
  "https://kzdaiqhnjcdsinzaygao.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sBlX-C1Wyp36sVki_6q1_A_13_Nl-ag";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =================================================
   STATE
================================================= */

let currentUser = null;
let currentProfile = null;
let currentRequisites = null;


/* =================================================
   HELPERS
================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatMoney(value){

  return Number(value || 0)
    .toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
}


function money(value){
  return `${formatMoney(value)} USDT`;
}


function roleName(role){
  return String(
    role || "USER"
  ).toUpperCase();
}


function getInitials(name,email){

  const source =
    name ||
    email ||
    "U";

  const parts =
    source.trim().split(/\s+/);

  if(parts.length >= 2){

    return (
      parts[0][0] +
      parts[1][0]
    ).toUpperCase();

  }

  return source
    .slice(0,2)
    .toUpperCase();
}


function showToast(
  message,
  error=false
){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.toggle(
    "error",
    error
  );

  toast.classList.add(
    "show"
  );

  setTimeout(()=>{
    toast.classList.remove(
      "show"
    );
  },4000);
}


/* =================================================
   LOGIN
================================================= */

async function login(
  email,
  password
){

  const button =
    $("loginButton");

  const errorBox =
    $("loginError");

  errorBox.style.display =
    "none";

  button.disabled =
    true;

  button.textContent =
    "Вход...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email:
            email.trim(),
          password:
            password
        });


    if(error){
      throw error;
    }


    if(!data?.user){

      throw new Error(
        "Пользователь не найден."
      );

    }


    currentUser =
      data.user;


    await loadProfile();

    await showApplication();


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    let message =
      error?.message ||
      "Ошибка входа.";


    if(
      message
        .toLowerCase()
        .includes(
          "invalid login credentials"
        )
    ){

      message =
        "Неверный email или пароль.";

    }


    if(
      message
        .toLowerCase()
        .includes(
          "email not confirmed"
        )
    ){

      message =
        "Email пользователя не подтверждён.";

    }


    errorBox.textContent =
      message;

    errorBox.style.display =
      "block";


  }finally{

    button.disabled =
      false;

    button.textContent =
      "Войти";

  }

}

async function loadProfile(){

  if(!currentUser){

    throw new Error(
      "Пользователь не найден."
    );

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if(error){

    throw new Error(
      "Ошибка загрузки профиля: " +
      error.message
    );

  }


  if(!data){

    throw new Error(
      "Профиль пользователя не найден в profiles."
    );

  }


  currentProfile =
    data;

}


/* =================================================
   SESSION
================================================= */

async function checkSession(){

  try{

    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if(!data?.session){

      showLogin();

      return;

    }


    currentUser =
      data.session.user;


    await loadProfile();

    await showApplication();


  }catch(error){

    console.error(
      error
    );

    await supabaseClient
      .auth
      .signOut();

    showLogin();

  }

}


supabaseClient
  .auth
  .onAuthStateChange(
    async(event)=>{

      if(
        event === "SIGNED_OUT"
      ){

        currentUser = null;
        currentProfile = null;
        currentRequisites = null;

        showLogin();

      }

    }
  );


function showLogin(){

  $("loginPage")
    .classList
    .remove("hidden");

  $("app")
    .classList
    .add("hidden");

}


async function showApplication(){

  $("loginPage")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  updateUserUI();

  setupAdminMenu();

  await loadRequisites();

  await renderPage(
    "dashboard"
  );

}

  if(!currentProfile){

async function createUser(){

  const button =
    $("createUserButton");

  const errorBox =
    $("createUserError");


  const name =
    $("newUserName")
      .value
      .trim();


  const email =
    $("newUserEmail")
      .value
      .trim();


  const password =
    $("newUserPassword")
      .value;


  const role =
    $("newUserRole")
      .value;


  const status =
    $("newUserStatus")
      .value;


  const deposit =
    Number(
      $("newUserDeposit")
        .value || 0
    );


  const turnover =
    Number(
      $("newUserTurnover")
        .value || 0
    );


  const profit =
    Number(
      $("newUserProfit")
        .value || 0
    );


  const commission =
    Number(
      $("newUserCommission")
        .value || 0
    );


  errorBox.style.display =
    "none";


  if(!email){

    errorBox.textContent =
      "Введите email.";

    errorBox.style.display =
      "block";

    return;

  }


  if(
    !password ||
    password.length < 6
  ){

    errorBox.textContent =
      "Пароль должен содержать минимум 6 символов.";

    errorBox.style.display =
      "block";

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Создание...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          "create-user",
          {
            body:{
              name:name,
              email:email,
              password:password,
              role:role,
              status:status,
              deposit:deposit,
              turnover:turnover,
              profit:profit,
              commission:commission
            }
          }
        );


    if(error){

      console.error(
        "FUNCTION ERROR:",
        error
      );

      throw new Error(
        error.message ||
        "Ошибка Edge Function"
      );

    }


    if(data?.error){

      throw new Error(
        data.error
      );

    }


    if(
      !data?.success
    ){

      throw new Error(
        "Supabase не подтвердил создание пользователя."
      );

    }


    closeModal();


    showToast(
      "Пользователь успешно создан."
    );


    await renderAdmin();


  }catch(error){

    console.error(
      "CREATE USER ERROR:",
      error
    );


    errorBox.textContent =
      error?.message ||
      "Не удалось создать пользователя.";

    errorBox.style.display =
      "block";


  }finally{

    button.disabled =
      false;

    button.textContent =
      "Создать пользователя";

  }

}

async function saveUser(
  userId
){

  const payload = {

    name:
      $("editName")
        .value
        .trim(),

    role:
      $("editRole")
        .value,

    status:
      $("editStatus")
        .value,

    deposit:
      Number(
        $("editDeposit")
          .value || 0
      ),

    turnover:
      Number(
        $("editTurnover")
          .value || 0
      ),

    profit:
      Number(
        $("editProfit")
          .value || 0
      ),

    commission:
      Number(
        $("editCommission")
          .value || 0
      )

  };


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .update(payload)
      .eq(
        "id",
        userId
      );


  if(error){

    showToast(
      error.message,
      true
    );

    return;

  }


  closeModal();

  showToast(
    "Пользователь обновлён."
  );

  await loadProfile();

  await renderAdmin();

}

async function submitWithdraw(){

  const amount =
    Number(
      $("withdrawAmount")
        .value
    );

  const wallet =
    $("withdrawWallet")
      .value
      .trim();


  if(
    !amount ||
    amount <= 0
  ){

    showToast(
      "Введите сумму USDT.",
      true
    );

    return;

  }


  if(!wallet){

    showToast(
      "Введите TRC20 адрес.",
      true
    );

    return;

  }


  closeModal();


  showToast(
    "Заявка подготовлена."
  );

}

/* =================================================

function openModal(){

  $("modal")
    .classList
    .remove("hidden");

}


function closeModal(){

  $("modal")
    .classList
    .add("hidden");

}


$("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


$("modal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target ===
        $("modal")
      ){

        closeModal();

      }

    }
  );
